name: ZooTV
options:
  bundleIdPrefix: house.thezoo
  deploymentTarget:
    tvOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: $(ZOOTV_DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
targets:
  ZooTV:
    type: application
    platform: tvOS
    sources: [App, Core]
    dependencies:
      - target: ZooTVTopShelf
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        ZooTVServerURL: $(ZOOTV_SERVER_URL)
        CFBundleURLTypes:
          - CFBundleURLName: house.thezoo.ZooTV
            CFBundleURLSchemes: [zootv]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: house.thezoo.ZooTV
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        PROVISIONING_PROFILE_SPECIFIER: $(ZOOTV_APP_PROVISIONING_PROFILE_SPECIFIER)
        INFOPLIST_KEY_CFBundleDisplayName: ZooTV
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: ZooTV connects to your home TV server to load the guide and play your channels.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
  ZooTVTopShelf:
    type: tv-app-extension
    platform: tvOS
    sources: [TopShelf, Core]
    info:
      path: TopShelf/Info.plist
      properties:
        CFBundlePackageType: $(PRODUCT_BUNDLE_PACKAGE_TYPE)
        CFBundleDisplayName: ZooTV
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ZooTVServerURL: $(ZOOTV_SERVER_URL)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.tv-top-shelf
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: house.thezoo.ZooTV.TopShelf
        PROVISIONING_PROFILE_SPECIFIER: $(ZOOTV_SHELF_PROVISIONING_PROFILE_SPECIFIER)
        # tvOS 27's TVExtensionMain (the product type's default entry point) returns immediately.
        LD_ENTRY_POINT: _NSExtensionMain
  ZooTVTests:
    type: bundle.unit-test
    platform: tvOS
    sources: [Tests/AppTests]
    dependencies:
      - target: ZooTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: house.thezoo.ZooTVTests
  ZooTVUITests:
    type: bundle.ui-testing
    platform: tvOS
    sources: [Tests/UITests]
    dependencies:
      - target: ZooTV
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: house.thezoo.ZooTVUITests
schemes:
  ZooTV:
    build:
      targets:
        ZooTV: all
        ZooTVTests: [test]
        ZooTVUITests: [test]
    test:
      targets: [ZooTVTests, ZooTVUITests]
